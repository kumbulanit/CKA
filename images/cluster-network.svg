<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="Inside the cluster: DNS finds the Service, kube-proxy picks a pod, the CNI carries the packet" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>Inside the cluster: DNS finds the Service, kube-proxy picks a pod, the CNI carries the packet</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="110" width="160" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="100.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">webapp pod</text><text x="100.0" y="155.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">connects to mysql-service</text><rect x="260" y="30" width="180" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="350.0" y="58.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">CoreDNS</text><text x="350.0" y="75.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">mysql-service →</text><text x="350.0" y="90.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">10.96.x.x</text><rect x="260" y="190" width="180" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="350.0" y="218.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kube-proxy rules</text><text x="350.0" y="235.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Service IP → pod IP</text><rect x="520" y="190" width="200" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="620.0" y="218.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">CNI (Calico, kindnet)</text><text x="620.0" y="235.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">routes between nodes</text><rect x="800" y="190" width="180" height="64" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="890.0" y="218.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">mysql pod</text><text x="890.0" y="235.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">on another node</text><polyline points="180,128 260,62" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="228.0" y="99.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">1 lookup</text><polyline points="180,156 260,222" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="228.0" y="193.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">2 connect</text><polyline points="440,222 520,222" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="480.0" y="215.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">3</text><polyline points="720,222 800,222" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><text x="760.0" y="215.0" font-size="11" font-weight="400" fill="#15803d" text-anchor="middle">4</text><text x="520" y="60" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">No CNI: nodes NotReady, pods stuck in ContainerCreating.</text><text x="520" y="74" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">kube-proxy down: Service IPs lead nowhere.</text><text x="520" y="88" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">CoreDNS down: names do not resolve.</text></svg>
