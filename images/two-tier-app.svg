<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="The two-tier app of the troubleshooting labs, and where each scenario breaks it" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>The two-tier app of the troubleshooting labs, and where each scenario breaks it</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="120" width="150" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="95.0" y="148.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">curl</text><text x="95.0" y="165.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">http://node01:30081</text><rect x="240" y="120" width="170" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="325.0" y="148.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">web-service</text><text x="325.0" y="165.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">NodePort 30081 → 8080</text><rect x="480" y="120" width="170" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="565.0" y="148.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">webapp-mysql</text><text x="565.0" y="165.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">DB_Host=mysql-service</text><text x="565.0" y="180.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">DB_User=root</text><rect x="720" y="120" width="170" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="805.0" y="148.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">mysql-service</text><text x="805.0" y="165.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">3306 → 3306</text><text x="805.0" y="180.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">selector name=mysql</text><rect x="720" y="240" width="170" height="56" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="805.0" y="264.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">mysql pod</text><text x="805.0" y="281.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">name=mysql · paswrd</text><polyline points="170,152 240,152" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="410,152 480,152" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="650,152 720,152" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="805,184 805,240" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><text x="325" y="100" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="middle">zeta: nodePort</text><text x="565" y="100" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="middle">delta, epsilon: user, password</text><text x="805" y="100" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="middle">alpha: name · beta: targetPort</text><text x="900" y="270" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">gamma: selector</text><text x="20" y="40" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">Check each hop in order: the node port, the web app’s settings, the Service’s name, port and</text><text x="20" y="54" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">selector, then the database login. kubectl describe and the web page’s error say which hop fails.</text></svg>
