<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="A Deployment manages ReplicaSets; a rollout moves pods from the old one to the new one" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>A Deployment manages ReplicaSets; a rollout moves pods from the old one to the new one</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="110" width="180" height="70" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="110.0" y="141.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Deployment</text><text x="110.0" y="158.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">kplabs-deployment</text><text x="110.0" y="173.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">replicas: 5</text><rect x="300" y="40" width="230" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="415.0" y="68.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">ReplicaSet (revision 1)</text><text x="415.0" y="85.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">image nginx · scaled to 0</text><rect x="300" y="190" width="230" height="64" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="415.0" y="218.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">ReplicaSet (revision 2)</text><text x="415.0" y="235.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">image nginx:1.17.3 · 5 pods</text><polyline points="200,130 300,72" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="258.0" y="105.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">old template</text><polyline points="200,160 300,222" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><text x="258.0" y="195.0" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">new template</text><rect x="620" y="196" width="60" height="52" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="650.0" y="227.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pod</text><rect x="692" y="196" width="60" height="52" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="722.0" y="227.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pod</text><rect x="764" y="196" width="60" height="52" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="794.0" y="227.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pod</text><rect x="836" y="196" width="60" height="52" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="866.0" y="227.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pod</text><rect x="908" y="196" width="60" height="52" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="938.0" y="227.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pod</text><rect x="620" y="46" width="60" height="52" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="650.0" y="77.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pod</text><rect x="692" y="46" width="60" height="52" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="722.0" y="77.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pod</text><rect x="764" y="46" width="60" height="52" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="794.0" y="77.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pod</text><rect x="836" y="46" width="60" height="52" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="866.0" y="77.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pod</text><rect x="908" y="46" width="60" height="52" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="938.0" y="77.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pod</text><polyline points="530,222 620,222" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><text x="575.0" y="215.0" font-size="11" font-weight="400" fill="#15803d" text-anchor="middle">creates</text><polyline points="530,72 620,72" fill="none" stroke="#7b8794" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-n)"/><text x="575.0" y="65.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">removes</text><polyline points="800,98 800,196" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><text x="808.0" y="151.0" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">one at a time</text><text x="808.0" y="164.0" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">(rolling update)</text><text x="20" y="286" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">kubectl rollout undo --to-revision=1 scales revision 1 up again and revision 2 down: the old ReplicaSet was kept for this.</text></svg>
