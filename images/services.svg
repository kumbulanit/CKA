<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="How traffic reaches a pod: a Service selects pods by label; NodePort opens a port on every node" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>How traffic reaches a pod: a Service selects pods by label; NodePort opens a port on every node</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="40" width="170" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="105.0" y="64.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">frontend-pod</text><text x="105.0" y="81.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">curl &lt;ClusterIP&gt;:8080</text><rect x="20" y="200" width="170" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="105.0" y="224.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Your browser</text><text x="105.0" y="241.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">curl node01:30008</text><rect x="290" y="120" width="200" height="76" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="390.0" y="154.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Service</text><text x="390.0" y="171.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">ClusterIP 10.96.x.x:8080</text><text x="390.0" y="186.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">selector app=myapp</text><rect x="290" y="230" width="200" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="390.0" y="254.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">NodePort 30008</text><text x="390.0" y="271.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">open on every node</text><rect x="590" y="120" width="150" height="76" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="665.0" y="154.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Endpoints</text><text x="665.0" y="171.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">the IPs of matching,</text><text x="665.0" y="186.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">ready pods</text><rect x="820" y="60" width="160" height="56" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="900.0" y="84.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pod 1</text><text x="900.0" y="101.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">app=myapp · :80</text><rect x="820" y="140" width="160" height="56" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="900.0" y="164.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pod 2</text><text x="900.0" y="181.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">app=myapp · :80</text><rect x="820" y="220" width="160" height="56" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="900.0" y="244.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pod 3</text><text x="900.0" y="261.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">app=myapp · :80</text><polyline points="190,68 240,68 240,150 290,150" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="190,228 290,255" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="390,230 390,196" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="398.0" y="217.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">kube-proxy</text><polyline points="490,158 590,158" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="540.0" y="151.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">looks up</text><polyline points="740,158 820,88" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><polyline points="740,158 820,168" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><polyline points="740,158 820,248" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><text x="590" y="240" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">A pod joins the endpoints when its labels</text><text x="590" y="254" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">match the selector, whoever created it.</text><text x="590" y="268" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">No endpoints = the selector matches nothing.</text></svg>
