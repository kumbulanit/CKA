"/><text x="758.0" y="206.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">uncordon</text><text x="758.0" y="223.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">from controlplane</text><polyline points="666,210 683,210" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="20" y="280" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">A kubelet may be older than the API server, never newer: that is why the control plane goes first.</text></svg>
