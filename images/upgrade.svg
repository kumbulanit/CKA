<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="A kubeadm upgrade, one minor version: control plane first, then each worker in turn" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>A kubeadm upgrade, one minor version: control plane first, then each worker in turn</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="30" font-size="13" font-weight="600" fill="#1f2933" text-anchor="start">controlplane</text><rect x="15" y="45" width="125" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="77.5" y="71.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">repo /v1.37/</text><text x="77.5" y="88.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">apt update</text><rect x="157" y="45" width="125" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="219.5" y="71.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kubeadm</text><text x="219.5" y="88.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">1.37.1-1.1</text><polyline points="140,75 157,75" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><rect x="299" y="45" width=