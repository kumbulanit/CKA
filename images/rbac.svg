<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="RBAC: who (subject) may do what (role), where (binding)" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>RBAC: who (subject) may do what (role), where (binding)</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="40" width="220" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="130.0" y="68.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">user zeal</text><text x="130.0" y="85.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">client certificate, CN=zeal</text><rect x="20" y="200" width="220" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="130.0" y="228.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">service account external</text><text x="130.0" y="245.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">system:serviceaccount:default:external</text><rect x="330" y="40" width="220" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="440.0" y="68.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">RoleBinding read-pods</text><text x="440.0" y="85.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">namespace default only</text><rect x="330" y="200" width="220" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="440.0" y="228.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">ClusterRoleBinding</text><text x="440.0" y="245.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">every namespace</text><rect x="650" y="120" width="200" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="750.0" y="148.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Role / ClusterRole</text><text x="750.0" y="165.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">pod-reader: list pods</text><rect x="880" y="30" width="100" height="56" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="930.0" y="63.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">allowed</text><rect x="880" y="230" width="100" height="56" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="930.0" y="254.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Forbidden</text><text x="930.0" y="271.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">no binding</text><polyline points="240,72 330,72" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="285.0" y="65.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">subject</text><polyline points="240,232 330,232" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="285.0" y="248.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">subject</text><polyline points="550,80 650,140" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="608.0" y="114.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="start">roleRef</text><polyline points="550,224 650,164" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="608.0" y="198.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">roleRef</text><polyline points="850,140 880,70" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><polyline points="850,168 880,250" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#a-bad)"/><text x="20" y="300" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">kubectl auth can-i list pods --as=system:serviceaccount:default:external answers the same question without curl.</text></svg>
