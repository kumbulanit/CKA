<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="How a pod gets a node: the scheduler filters, then scores; nodeName and static pods skip it" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>How a pod gets a node: the scheduler filters, then scores; nodeName and static pods skip it</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="120" width="150" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="95.0" y="148.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">New pod</text><text x="95.0" y="165.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">no nodeName yet</text><rect x="240" y="40" width="280" height="224" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="380.0" y="157.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle"></text><text x="380" y="64" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kube-scheduler: filter</text><rect x="260" y="80" width="240" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="380.0" y="99.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">taints</text><text x="380.0" y="116.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">tolerated?</text><rect x="260" y="138" width="240" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="380.0" y="157.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">nodeSelector / affinity</text><text x="380.0" y="174.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">labels match?</text><rect x="260" y="196" width="240" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="380.0" y="215.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">resources</text><text x="380.0" y="232.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">enough unrequested CPU, memory?</text><rect x="580" y="120" width="120" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="640.0" y="148.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">score</text><text x="640.0" y="165.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">best node</text><rect x="800" y="120" width="180" height="64" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="890.0" y="148.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kubelet on node01</text><text x="890.0" y="165.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">starts the pod</text><polyline points="170,152 240,152" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="520,152 580,152" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="550.0" y="145.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">nodes left</text><polyline points="700,152 800,152" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><text x="750.0" y="145.0" font-size="11" font-weight="400" fill="#15803d" text-anchor="middle">sets nodeName</text><text x="20" y="210" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">No node passes the filter:</text><text x="20" y="224" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">the pod stays Pending</text><text x="20" y="238" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">(describe: FailedScheduling).</text><rect x="560" y="290" width="190" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="655.0" y="314.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">nodeName: node01</text><text x="655.0" y="331.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">in the manifest</text><polyline points="750,318 860,318 860,184" fill="none" stroke="#7b8794" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-n)"/><text x="805.0" y="311.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">scheduler skipped</text><rect x="20" y="290" width="220" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="130.0" y="314.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Static pod</text><text x="130.0" y="331.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">/etc/kubernetes/manifests</text><polyline points="240,318 300,318 300,368 940,368 940,184" fill="none" stroke="#7b8794" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-n)"/><text x="308.0" y="347.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">the kubelet reads the folder itself</text></svg>
