<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 354" width="1000" height="354" role="img" aria-label="A kubeadm cluster: what runs where, and who talks to whom" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>A kubeadm cluster: what runs where, and who talks to whom</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="54" width="470" height="270" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="255.0" y="194.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle"></text><text x="255" y="78" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">controlplane</text><rect x="40" y="94" width="200" height="56" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="140.0" y="118.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kube-apiserver</text><text x="140.0" y="135.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">every request goes here</text><rect x="270" y="94" width="200" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="370.0" y="118.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">etcd</text><text x="370.0" y="135.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">the cluster state</text><rect x="40" y="174" width="200" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="140.0" y="198.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kube-scheduler</text><text x="140.0" y="215.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">picks a node</text><rect x="270" y="174" width="200" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="370.0" y="198.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">controller-manager</text><text x="370.0" y="215.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">keeps replicas, nodes</text><rect x="40" y="254" width="430" height="50" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="255.0" y="275.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kubelet + containerd</text><text x="255.0" y="292.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">static pods: /etc/kubernetes/manifests</text><polyline points="240,122 270,122" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="140,174 140,150" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="370,174 370,150 240,136" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><rect x="560" y="54" width="200" height="270" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="660.0" y="194.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle"></text><text x="660" y="78" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">node01</text><rect x="575" y="94" width="170" height="50" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="660.0" y="115.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kubelet</text><text x="660.0" y="132.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">runs this node’s pods</text><rect x="575" y="159" width="170" height="50" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="660.0" y="180.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kube-proxy</text><text x="660.0" y="197.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Service rules</text><rect x="575" y="224" width="170" height="50" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="660.0" y="245.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">calico-node</text><text x="660.0" y="262.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">pod network</text><text x="660" y="306" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">containerd · your pods</text><rect x="780" y="54" width="200" height="270" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="880.0" y="194.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle"></text><text x="880" y="78" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">node02</text><rect x="795" y="94" width="170" height="50" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="880.0" y="115.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kubelet</text><text x="880.0" y="132.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">runs this node’s pods</text><rect x="795" y="159" width="170" height="50" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="880.0" y="180.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kube-proxy</text><text x="880.0" y="197.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Service rules</text><rect x="795" y="224" width="170" height="50" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="880.0" y="245.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">calico-node</text><text x="880.0" y="262.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">pod network</text><text x="880" y="306" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">containerd · your pods</text><polyline points="600,94 600,40 100,40 100,94" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="350.0" y="33.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">every kubelet watches the API server and reports its node</text><text x="500" y="344" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">kubectl talks only to kube-apiserver; everything else watches it.</text></svg>
