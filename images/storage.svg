<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Storage: a pod asks for a claim; the claim binds a volume, made by an admin or by a provisioner" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>Storage: a pod asks for a claim; the claim binds a volume, made by an admin or by a provisioner</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="110" width="150" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="95.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pod mypod</text><text x="95.0" y="155.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">mounts /var/www/html</text><rect x="250" y="110" width="170" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="335.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">PVC myclaim</text><text x="335.0" y="155.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">1Gi · ReadWriteOnce</text><rect x="520" y="30" width="220" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="630.0" y="58.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">PV pv-vol1</text><text x="630.0" y="75.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">made by you (static)</text><rect x="520" y="190" width="220" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="630.0" y="218.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">StorageClass local-path</text><text x="630.0" y="235.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">provisioner makes a PV</text><rect x="820" y="110" width="160" height="64" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="900.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">disk on the node</text><text x="900.0" y="155.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">hostPath · /opt/...</text><polyline points="170,142 250,142" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="210.0" y="135.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">claimName</text><polyline points="420,128 520,62" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="455" y="72" font-size="11" font-weight="400" fill="#616e7c" text-anchor="end">binds: size, mode,</text><text x="455" y="86" font-size="11" font-weight="400" fill="#616e7c" text-anchor="end">class all match</text><polyline points="420,156 520,222" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="455" y="222" font-size="11" font-weight="400" fill="#2563eb" text-anchor="end">storageClassName</text><polyline points="740,62 820,130" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><polyline points="740,222 820,154" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><text x="250" y="280" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">No match: the claim stays Pending. WaitForFirstConsumer waits for a pod before it binds.</text></svg>
