<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="Metrics and autoscaling: from each kubelet to kubectl top and the HPA" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>Metrics and autoscaling: from each kubelet to kubectl top and the HPA</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="110" width="170" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="105.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kubelets</text><text x="105.0" y="155.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">CPU, memory per pod</text><rect x="270" y="110" width="180" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="360.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">metrics-server</text><text x="360.0" y="155.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">--kubelet-insecure-tls</text><rect x="530" y="40" width="170" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="615.0" y="68.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kubectl top</text><text x="615.0" y="