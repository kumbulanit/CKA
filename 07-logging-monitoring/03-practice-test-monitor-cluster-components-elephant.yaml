apiVersion: v1
kind: Pod
metadata:
  name: elephant
spec:
  containers:
  - name: elephant
    image: busybox:1.37
    command: ["sh", "-c", "dd if=/dev/zero of=/fill/data bs=1M count=150; sleep 1d"]
    volumeMounts:
    - name: fill
      mountPath: /fill
  volumes:
  - name: fill
    emptyDir:
      medium: Memory
---
apiVersion: v1
kind: Pod
metadata:
  name: lion
spec:
  containers:
  - name: lion
    image: busybox:1.37
    command: ["sh", "-c", "while true; do :; done"]
    resources:
      limits:
        cpu: 200m
---
apiVersion: v1
kind: Pod
metadata:
  name: rabbit
spec:
  containers:
  - name: rabbit
    image: busybox:1.37
    command: ["sleep", "1d"]
