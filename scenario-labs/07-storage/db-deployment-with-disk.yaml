apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: db
spec:
  replicas: 1
  strategy:
    type: Recreate            # stop the old pod before starting a new one (one disk, one database)
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: shop
        - name: POSTGRES_DB
          value: shop
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data          # the database files, on the disk
        - name: init
          mountPath: /docker-entrypoint-initdb.d       # runs once, on an empty disk
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: db-data
      - name: init
        configMap:
          name: db-init
