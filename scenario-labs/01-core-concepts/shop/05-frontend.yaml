apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /usr/share/nginx/html/index.html   # the web page
          subPath: index.html
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf     # the nginx settings
          subPath: default.conf
      volumes:
      - name: config
        configMap:
          name: frontend-config
