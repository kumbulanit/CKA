apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: postgrest/postgrest:v12.2.3
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: backend-config        # all the settings
        env:
        - name: PGPASSWORD              # the database password
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
